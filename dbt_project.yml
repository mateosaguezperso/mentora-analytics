name: mentora_analytics
version: "1.0.0"
config-version: 2
require-dbt-version: [">=1.10.0", "<2.0.0"]

profile: mentora_analytics

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

clean-targets:
  - target
  - dbt_packages

vars:
  # Freeze "today" so every metric is reproducible (CI, docs, interviews).
  # In production you would drop this and use current_date.
  analysis_end_date: "2026-10-01"
  # Incremental models re-process this many days to catch late-arriving updates.
  incremental_lookback_days: 3
  # A student is "activated" if they complete a first conversation within N days of signup.
  activation_window_days: 30

seeds:
  mentora_analytics:
    +schema: raw
    +quote_columns: false
    # Seeds only simulate the raw layer (in prod: Stitch / Fivetran / Airbyte).
    # Types are inferred by the adapter; staging re-casts everything explicitly
    # so the models don't depend on that inference.

models:
  mentora_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
      product:
        +schema: product
      finance:
        +schema: finance

data_tests:
  mentora_analytics:
    +severity: error
    +store_failures: false
