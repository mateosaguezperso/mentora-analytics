version: 2

models:
  - name: int_bookings__pivoted
    description: >
      One row per booking rebuilt from the CDC log: current status + one
      timestamp per lifecycle milestone.
    columns:
      - name: booking_id
        data_tests: [unique, not_null]
      - name: current_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [requested, accepted, declined, cancelled, completed, expired]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "responded_at is null or responded_at >= requested_at"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "completed_at is null or accepted_at is not null"
          config:
            description: A conversation cannot be completed without being accepted first.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "completed_at is null or completed_at >= accepted_at"
          config:
            description: Lifecycle ordering - acceptance always happens before completion.

  - name: int_students__booking_milestones
    description: Booking milestones per student (first request, first completed conversation...).
    columns:
      - name: student_id
        data_tests: [unique, not_null]

  - name: int_companies__mrr_monthly
    description: >
      Company x month MRR, including zero-MRR months after churn
      (end-of-month snapshot convention).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [company_id, month_start]
    columns:
      - name: mrr_eur
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

unit_tests:
  - name: test_pivoted_terminal_status_wins_on_timestamp_tie
    description: >
      When 'accepted' and 'cancelled' share the same timestamp, the booking
      must end up 'cancelled' and keep both milestones.
    model: int_bookings__pivoted
    given:
      - input: ref('stg_platform__booking_events')
        rows:
          - { booking_id: "bk_1", student_id: 1, mentor_id: 10, booking_status: requested, requested_at: "2025-01-01 09:00:00", scheduled_at: "2025-01-10 10:00:00", status_changed_at: "2025-01-01 09:00:00" }
          - { booking_id: "bk_1", student_id: 1, mentor_id: 10, booking_status: accepted,  requested_at: "2025-01-01 09:00:00", scheduled_at: "2025-01-10 10:00:00", status_changed_at: "2025-01-02 12:00:00" }
          - { booking_id: "bk_1", student_id: 1, mentor_id: 10, booking_status: cancelled, requested_at: "2025-01-01 09:00:00", scheduled_at: "2025-01-10 10:00:00", status_changed_at: "2025-01-02 12:00:00" }
          - { booking_id: "bk_2", student_id: 2, mentor_id: 10, booking_status: requested, requested_at: "2025-01-05 09:00:00", scheduled_at: "2025-01-12 10:00:00", status_changed_at: "2025-01-05 09:00:00" }
          - { booking_id: "bk_2", student_id: 2, mentor_id: 10, booking_status: declined,  requested_at: "2025-01-05 09:00:00", scheduled_at: "2025-01-12 10:00:00", status_changed_at: "2025-01-06 18:00:00" }
    expect:
      rows:
        - { booking_id: "bk_1", current_status: cancelled, accepted_at: "2025-01-02 12:00:00", responded_at: "2025-01-02 12:00:00", cancelled_at: "2025-01-02 12:00:00" }
        - { booking_id: "bk_2", current_status: declined,  accepted_at: null,                  responded_at: "2025-01-06 18:00:00", cancelled_at: null }
